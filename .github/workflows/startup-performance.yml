name: Startup performance
on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/startup-performance.yml'
      - 'lib/main.dart'
      - 'lib/providers/auth_provider.dart'
      - 'lib/services/startup_trace.dart'
      - 'lib/services/notification_service.dart'
      - 'lib/services/deep_link_service.dart'
      - 'ios/Runner/AppDelegate.swift'
      - 'test/services/startup_trace_test.dart'
      - 'test/services/notification_startup_test.dart'
      - 'test/services/deep_link_startup_test.dart'
      - 'tool/startup_profile/main.dart'
permissions:
  contents: read
concurrency:
  group: startup-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  startup-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Startup ordering, telemetry and notification launch handling
        run: >-
          flutter test
          test/services/startup_trace_test.dart
          test/services/notification_startup_test.dart
          test/services/deep_link_startup_test.dart
          test/services/notification_preference_test.dart
          test/services/notification_navigation_service_test.dart
          test/services/auth_service_test.dart
          test/services/local_read_tracker_export_test.dart
      - name: Analyze startup implementation
        run: >-
          flutter analyze --no-pub
          lib/main.dart lib/providers/auth_provider.dart
          lib/services/startup_trace.dart lib/services/notification_service.dart
          lib/services/deep_link_service.dart tool/startup_profile/main.dart
          test/services/startup_trace_test.dart
          test/services/notification_startup_test.dart
          test/services/deep_link_startup_test.dart
      - run: git diff --exit-code -- pubspec.lock
