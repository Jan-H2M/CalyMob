name: Palanquee persistence
on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/palanquee-regressions.yml'
      - 'lib/models/palanquee.dart'
      - 'lib/services/palanquee_service.dart'
      - 'lib/screens/operations/palanquee_screen.dart'
      - 'lib/utils/palanquee_simulation_selection.dart'
      - 'lib/utils/fiche_palanquee_pdf.dart'
      - 'test/screens/palanquee_simulation_persistence_test.dart'
      - 'test/utils/palanquee_simulation_selection_test.dart'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/palanquee-regressions.yml'
      - 'lib/models/palanquee.dart'
      - 'lib/services/palanquee_service.dart'
      - 'lib/screens/operations/palanquee_screen.dart'
      - 'lib/utils/palanquee_simulation_selection.dart'
      - 'lib/utils/fiche_palanquee_pdf.dart'
      - 'test/screens/palanquee_simulation_persistence_test.dart'
      - 'test/utils/palanquee_simulation_selection_test.dart'
permissions:
  contents: read
jobs:
  palanquee-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Complete planning roster survives save and reopen (synthetic data)
        run: flutter test --no-pub test/screens/palanquee_simulation_persistence_test.dart test/utils/palanquee_simulation_selection_test.dart
      - name: Dependencies unchanged
        run: git diff --exit-code -- pubspec.lock
