name: Boutique member missions
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  mobile-missions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter test test/services/member_supplier_access_test.dart test/services/member_missions_service_test.dart test/screens/member_missions_screen_test.dart test/services/boutique_access_service_test.dart test/screens/boutique_screen_access_test.dart test/services/deep_link_startup_test.dart test/services/auth_service_test.dart test/services/boutique_mission_navigation_test.dart test/screens/mission_expense_identity_test.dart
      - run: flutter analyze --no-pub --no-fatal-infos lib/providers/auth_provider.dart lib/main.dart lib/utils/boutique_mission_navigation.dart lib/screens/auth/login_screen.dart lib/screens/auth/force_password_change_screen.dart lib/services/boutique/member_missions_service.dart lib/screens/boutique/member_missions_screen.dart lib/services/boutique/boutique_access_service.dart
      - run: node functions/src/expenses/__tests__/expenseSync.check.cjs
      - run: git diff --exit-code -- pubspec.lock
  missions-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --yes firebase-tools@15.12.0 emulators:exec --only firestore --project demo-btq-missions --config firebase.boutique-flow-qa.json 'node scripts/test-boutique-member-missions-rules.cjs'
