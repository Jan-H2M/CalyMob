name: Secret scan

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1

      - name: Select commits to scan
        id: scan-range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] \
            && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..${HEAD_SHA}"
          else
            range="$HEAD_SHA"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Reject sensitive credential paths
        run: bash scripts/security/check-sensitive-files.sh --git-range "${{ steps.scan-range.outputs.range }}"

      - name: Scan commits for secrets
        run: gitleaks git --no-banner --redact --verbose --log-opts="${{ steps.scan-range.outputs.range }}" .
