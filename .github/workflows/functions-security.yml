name: Functions security

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'functions/**'
      - '.github/workflows/functions-security.yml'
      - 'scripts/pr167_production*.py'
  push:
    branches: [main, dev]
    paths:
      - 'functions/**'
      - '.github/workflows/functions-security.yml'
      - 'scripts/pr167_production*.py'

permissions:
  contents: read

concurrency:
  group: functions-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install the committed dependency graph
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      - name: Run synthetic Functions regressions
        run: npm test -- --runInBand
      - name: Production archive and configuration preservation
        run: python3 ../scripts/pr167_production_test.py
      - name: Verify the lockfile stayed unchanged
        run: git diff --exit-code -- package-lock.json
