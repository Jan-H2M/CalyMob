name: Isolated DEV
on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/isolated-dev.yml'
      - 'scripts/isolated-dev/**'
      - 'tool/isolated_dev/**'
      - 'test/dev/**'
      - 'test/support/isolated_dev_app.dart'
      - 'test/support/formation_dev_scenarios.dart'
      - 'test/support/apnee_dev_scenario.dart'
      - 'lib/widgets/piscine/pool_apnee_overview.dart'
      - 'lib/screens/piscine/session_detail_screen.dart'
      - 'lib/screens/profile/who_is_who_screen.dart'
      - 'lib/models/participant_operation.dart'
      - 'lib/models/user_event_registration.dart'
      - 'lib/utils/event_registration_error.dart'
      - 'lib/widgets/operation_date_metadata.dart'
      - 'lib/widgets/grouped_dive_locations.dart'
      - 'lib/models/dive_location.dart'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/isolated-dev.yml'
      - 'scripts/isolated-dev/**'
      - 'tool/isolated_dev/**'
      - 'test/dev/**'
      - 'test/support/isolated_dev_app.dart'
      - 'test/support/formation_dev_scenarios.dart'
      - 'test/support/apnee_dev_scenario.dart'
      - 'lib/widgets/piscine/pool_apnee_overview.dart'
      - 'lib/screens/piscine/session_detail_screen.dart'
      - 'lib/widgets/operation_date_metadata.dart'
      - 'lib/widgets/grouped_dive_locations.dart'
      - 'lib/models/dive_location.dart'
permissions:
  contents: read
concurrency:
  group: isolated-dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Credentialless static-server security tests
        run: node --test scripts/isolated-dev/server.test.mjs
      - name: Merged client fixes and fictional DEV scenarios
        run: flutter test test/dev/isolated_dev_test.dart test/screens/formation_list_attention_order_test.dart test/screens/formation_list_error_state_test.dart test/services/pool_formation_overview_reader_test.dart test/models/formation_modality_progress_test.dart test/models/participant_operation_untrusted_payment_aliases_test.dart test/models/participant_operation_payment_status_test.dart test/services/operation_payment_status_integrity_test.dart test/utils/event_registration_error_test.dart test/screens/operation_detail_unregister_test.dart test/models/dive_environment_test.dart test/utils/dive_location_search_test.dart test/services/dive_location_sync_contract_test.dart
      - name: Real Chrome widget execution (fictional data only)
        run: flutter test --platform chrome test/dev
      - name: Formation and apnea recovery regression contracts
        run: flutter test test/dev/formation_dev_test.dart test/dev/apnee_dev_test.dart test/widgets/pool_apnee_overview_test.dart test/widgets/pool_apnee_retry_dev_test.dart test/services/pool_formation_overview_reader_test.dart test/models/formation_modality_progress_test.dart
      - name: Build the separate isolated DEV target (never lib/main.dart)
        run: node scripts/isolated-dev/build.mjs
      - name: Smoke the actual release artifact in a fresh offline Chrome profile
        run: |
          dev_npm_user_config=$(mktemp "$RUNNER_TEMP/isolated-dev-npm-user.XXXXXX")
          dev_npm_global_config=$(mktemp "$RUNNER_TEMP/isolated-dev-npm-global.XXXXXX")
          npm install --prefix .dart_tool/isolated-dev --no-save --ignore-scripts --package-lock=false --userconfig="$dev_npm_user_config" --globalconfig="$dev_npm_global_config" --registry=https://registry.npmjs.org playwright-core@1.62.1
          node scripts/isolated-dev/smoke.mjs
      - name: Lockfile unchanged
        run: git diff --exit-code -- pubspec.lock
