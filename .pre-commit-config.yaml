repos:
  - repo: local
    hooks:
      - id: forbid-sensitive-files
        name: Reject committed credentials and signing material
        entry: bash scripts/security/check-sensitive-files.sh
        language: system
        pass_filenames: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
