  # ==========================================================================
  # MANUAL TRIGGER WORKFLOW - On-Demand Builds
  # ==========================================================================
  manual-build:
    name: Manual Build (Android Only)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # iOS signing disabled - uncomment when iOS signing is configured
      # ios_signing:
      #   distribution_type: app_store
      #   bundle_identifier: be.calypso.calycompta

      flutter: 3.38.9
      node: 22

    # Manual trigger only (no automatic triggers)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: false

    scripts:
      - name: Load Firebase config (Android)
        script: |
          echo "Loading Android Firebase configuration..."
          cd $CM_BUILD_DIR
          if [ -z "$ANDROID_FIREBASE_JSON" ]; then
            echo "ANDROID_FIREBASE_JSON is required; no embedded credential fallback is allowed." >&2
            exit 1
          fi
          printf '%s' "$ANDROID_FIREBASE_JSON" | base64 --decode > android/app/google-services.json
          echo "✅ google-services.json created from environment variable"

      - name: Get Flutter packages
        script: |
          echo "📦 Getting Flutter packages"
          flutter pub get

      - name: Build Android APK
        script: |
          set -euo pipefail
          bash scripts/verify_payment_release.sh
          echo "🏗️ Building Android APK (debug mode - no signing required)"
          flutter build apk --debug
          echo "✅ Debug APK Build completed!"
          ls -lh build/app/outputs/flutter-apk/*.apk

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - jan.andriessens@gmail.com
        notify:
          success: true
          failure: true

  # ==========================================================================
  # iOS MANUAL BUILD WORKFLOW - On-Demand iOS Builds
  # ==========================================================================
  ios-manual-build:
    name: Manual iOS Artifact Build (No Store Publishing)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic CI/CD

    environment:
      # iOS Code Signing - Using explicit profile references
      ios_signing:
        provisioning_profiles:
          - CalyMob App Store
        certificates:
          - CalyMob Distribution

      # Environment variables for Xcode
      vars:
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"

      # Flutter Version
      flutter: 3.38.9
      node: 22
      xcode: latest
      cocoapods: default

    # Manual trigger only (no automatic triggers)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
          include: false

    scripts:
      - name: Set up environment
        script: |
          echo "🚀 Starting iOS manual build"
          echo "Flutter version:"
          flutter --version
          echo "Xcode version:"
          xcodebuild -version

      - name: Verify Firebase configuration
        script: |
          echo "🔧 Checking iOS Firebase configuration"
          echo "Current directory: $(pwd)"
          echo "Listing ios/Runner directory:"
          ls -la ios/Runner/ || true
          if [ -f "ios/Runner/GoogleService-Info.plist" ]; then
            echo "✅ GoogleService-Info.plist exists"
            ls -la ios/Runner/GoogleService-Info.plist
          else
            echo "⚠️ WARNING: GoogleService-Info.plist not found, but continuing build"
            echo "The file should be in the repository at ios/Runner/GoogleService-Info.plist"
          fi

      - name: Build iOS IPA
        script: |
          set -euo pipefail
          # Build-only: the hardened script binds the fresh IPA to the exact
          # clean commit/tree. Native review and manifest completion happen
          # after this job; Codemagic never uploads the artifact.
          bash scripts/build_release_ipa.sh

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

    publishing:
      email:
        recipients:
          - jan.andriessens@gmail.com
        notify:
          success: true
          failure: true

      # Store publishing is deliberately absent. A CI build cannot supply the
      # post-build native-review/artifact evidence required by schema v2.
      # Upload only through scripts/run_fastlane.sh after that evidence exists.

